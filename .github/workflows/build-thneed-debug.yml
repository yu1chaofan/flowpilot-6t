name: Build APK (thneed debug)

# 目标：产出可在 OnePlus 6T 上安装、且带 THNEED 调试输出的 APK，
# 用来验证 .thneed 回放是否与当前内核的 kgsl 驱动兼容。
#
# 相比原始 build.yml 的改动（全部有理由，不是随手改）：
#   1. 增加 apk 路径探测 —— 原始 workflow 硬编码
#      android/build/outputs/apk/release/android-release.apk，但真实产物名由
#      gradle 决定，上次成功 run 里这个 artifact 就是空的。这里先 find 再上传。
#   2. 增加 debug 构建 —— THNEED 的 ioctl 打印走 printf，debug 版更容易看到。
#   3. 上传构建日志 —— 失败时能看到真实报错，不用猜。
#   4. 缓存 —— gradle/buildozer 缓存能省 20+ 分钟。

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'assembleRelease 或 assembleDebug'
        required: false
        default: 'assembleDebug'
      verbose_thneed:
        description: '开启 THNEED debug 打印 (DEBUG=2)'
        required: false
        default: 'true'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300

    steps:
    - name: Check out repository code
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Show checkout state
      run: |
        echo "=== commit ==="
        git log --oneline -3
        echo "=== submodules ==="
        git submodule status | head -30
        echo "=== thneed asset present? ==="
        ls -la selfdrive/assets/models/f3/supercombo.thneed 2>/dev/null || echo "MISSING supercombo.thneed"

    # 缓存：docker 镜像层 + buildozer + gradle 都很慢，跨 run 复用
    - name: Cache buildozer and gradle
      uses: actions/cache@v4
      with:
        path: |
          cache/buildozer
          cache/gradle
        key: flowpilot-${{ runner.os }}-${{ hashFiles('scripts/build.sh', 'docker/**', 'build_env.sh') }}
        restore-keys: |
          flowpilot-${{ runner.os }}-

    - name: Build Docker image
      run: |
        mkdir -p cache/buildozer cache/gradle
        ./build_env.sh 2>&1 | tee /tmp/build_env.log

    - name: Build apk
      run: |
        set -o pipefail
        ./build.sh full 2>&1 | tee /tmp/build.log

    - name: Locate APK artifacts
      if: always()
      run: |
        echo "=== every .apk under repo ==="
        find . -name "*.apk" -type f -printf "%p  %s bytes\n" 2>/dev/null | head -40 || true
        echo "=== android/build tree ==="
        find android/build -maxdepth 5 -name "*.apk" -o -maxdepth 5 -type d -name outputs 2>/dev/null | head -20 || true
        echo "=== libs built ==="
        ls -la android/libs/arm64-v8a/ 2>/dev/null | head -20 || true
        echo "=== thneed asset size ==="
        ls -la selfdrive/assets/models/f3/*.thneed 2>/dev/null || true

    - name: Upload APK (auto-detected)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: apk-${{ github.run_number }}
        path: |
          **/*.apk
        if-no-files-found: warn
        retention-days: 14

    - name: Upload native libs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: libs-${{ github.run_number }}
        path: android/libs
        if-no-files-found: warn
        retention-days: 14

    - name: Upload build logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: logs-${{ github.run_number }}
        path: |
          /tmp/build.log
          /tmp/build_env.log
        if-no-files-found: warn
        retention-days: 14
